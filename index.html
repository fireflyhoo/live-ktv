<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹幕蹦迪舞台 · 画面层</title>
<link rel="stylesheet" href="css/stage.css">
</head>
<body class="mode-stage">

<div id="viewport">
  <!-- 舞台层：低分辨率像素 canvas，放大后保持硬边 -->
  <canvas id="stage" width="640" height="360"></canvas>
  <!-- 覆盖层：高清 DOM，昵称 / 表情包 / 评论气泡 -->
  <div id="overlay"></div>
  <!-- 飘屏弹幕条 -->
  <div id="ticker"><div id="ticker-track"></div></div>
</div>

<!-- 首次打开时的指路提示，几秒后自己淡掉 -->
<div id="hint">
  控制台在 <a href="console.html" target="_blank">console.html</a>
  <span class="hint-key">按 H 隐藏</span>
</div>

<script src="js/palette.js"></script>
<script src="js/dancer.js"></script>
<script src="js/stage.js"></script>
<script src="js/danmaku.js"></script>
<script src="js/overlay.js"></script>
<script src="js/link.js"></script>
<script src="js/app.js"></script>
</body>
</html>
